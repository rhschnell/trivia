<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trivia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="center">
    <label for="quantity" class="title-question">How many questions do you want to generate?</label>

    <div class="input-section">
        <input type="number" class="input-amount" id="quantity" name="quantity" min="1" max="50">
        <button type="button" class="button" onclick=generateQuestions()>Generate questions!</button>
    </div>

    <button type="button" id="check-answer-top" class="button hidden" onclick=getAnswers()>Check answers!</button>

    <div id="question-container">

    </div>

    <button type="button" id="check-answer-bottom" class="button hidden" onclick=getAnswers()>Check answers!</button>
</div>

<script src="script.js"></script>

</body>
</html>
